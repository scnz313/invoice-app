name: invoice_app
description: A professional invoice management app with Airbnb-inspired design
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  provider: ^6.1.1

  # Database
  sqflite: ^2.3.0
  path: ^1.8.3

  # JSON Serialization
  json_annotation: ^4.8.1

  # Utilities
  uuid: ^4.2.1
  shared_preferences: ^2.2.2

  # Charts and Visualizations
  fl_chart: ^0.66.0

  # UI Components
  cupertino_icons: ^1.0.2

  # File Operations
  path_provider: ^2.1.1

  # Date and Time
  intl: ^0.18.1

  # HTTP and Networking (for future cloud features)
  http: ^1.1.0

  # Image Picker (for logo upload)
  image_picker: ^1.0.4

  # PDF Generation
  pdf: ^3.10.7
  printing: ^5.11.1

  # Barcode Scanning
  mobile_scanner: ^3.5.6
  camera: ^0.10.5+5

  # Local Notifications
  flutter_local_notifications: ^16.3.0

  # Connectivity
  connectivity_plus: ^5.0.2

  # Encryption (for data security)
  encrypt: ^5.0.3

  # CSV Export
  csv: ^5.1.1

  # Excel Export
  excel: ^2.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Code Generation
  build_runner: ^2.4.7
  json_serializable: ^6.7.1

  # Linting
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  # Fonts (commented out for now, using system fonts)
  # fonts:
  #   - family: Cereal
  #     fonts:
  #       - asset: assets/fonts/Cereal-Book.otf
  #         weight: 400
  #       - asset: assets/fonts/Cereal-Medium.otf
  #         weight: 500
  #       - asset: assets/fonts/Cereal-Bold.otf
  #         weight: 700

  # Assets
  assets:
    - assets/images/
    - assets/icons/
